# T3's inventory with fw-win-01 declaring an artifact language that has no
# template on Windows: `sh` is POSIX only.
[[host]]
name = "fw-01"
address = "10.0.1.1"
os = "freebsd"
roles = ["fw"]
reach = ["ssh"]
filesystem = true
scheduler = "cron"

[[host]]
name = "fw-win-01"
address = "10.0.1.2"
os = "windows"
roles = ["fw"]
reach = ["ssh"]
filesystem = true
scheduler = "task-scheduler"
artifact = "sh"

[[host]]
name = "fw-02"
address = "10.0.1.3"
os = "freebsd"
roles = ["fw"]
reach = ["ssh"]
filesystem = true
scheduler = "cron"
artifact = "python"

[[host]]
name = "fw-win-02"
address = "10.0.1.4"
os = "windows"
roles = ["fw"]
reach = ["ssh"]
filesystem = true
scheduler = "task-scheduler"
artifact = "python"

[[host]]
name = "fw-mac-01"
address = "10.0.1.5"
os = "macos"
roles = ["fw"]
reach = ["ssh"]
filesystem = true
scheduler = "launchd"

[authenticators]
netops = { human = true }
