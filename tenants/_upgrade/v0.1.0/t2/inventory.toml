# T2 inventory. node-b is the promoting node; node-a the corpse; node-c is
# reachable only by console from the controller, so steps on it are deferred.
[[host]]
name = "node-b"
address = "10.0.7.12"
os = "freebsd"
roles = ["hv"]
reach = ["ssh"]
filesystem = true
scheduler = "cron"

[[host]]
name = "node-a"
address = "10.0.7.11"
os = "freebsd"
roles = ["hv"]
reach = ["ssh"]
filesystem = true

[[host]]
name = "node-c"
address = "10.0.7.13"
os = "freebsd"
roles = ["hv"]
reach = ["console"]
filesystem = true

[site]
max_wait = "30m"

[authenticators]
operator = { human = true }
second_operator = { human = true }
fence_driver = { human = false }
