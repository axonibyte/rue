# T3 inventory: a FreeBSD firewall host and its Windows counterpart, the same
# pair with their backstop artifacts rendered in Python (uv, PEP 723), a
# macOS pf host on the default sh artifact, and the Linux host the
# end-to-end harness drives. `artifact` absent means the
# host's native shell.
[[host]]
name = "fw-01"
address = "10.0.1.1"
os = "freebsd"
roles = ["fw"]
reach = ["ssh"]
filesystem = true
scheduler = "cron"

[[host]]
name = "fw-win-01"
address = "10.0.1.2"
os = "windows"
roles = ["fw"]
reach = ["ssh"]
filesystem = true
scheduler = "task-scheduler"

[[host]]
name = "fw-02"
address = "10.0.1.3"
os = "freebsd"
roles = ["fw"]
reach = ["ssh"]
filesystem = true
scheduler = "cron"
artifact = "python"

[[host]]
name = "fw-win-02"
address = "10.0.1.4"
os = "windows"
roles = ["fw"]
reach = ["ssh"]
filesystem = true
scheduler = "task-scheduler"
artifact = "python"

[[host]]
name = "fw-mac-01"
address = "10.0.1.5"
os = "macos"
roles = ["fw"]
reach = ["ssh"]
filesystem = true
scheduler = "launchd"

[[host]]
name = "fw-lnx-01"
address = "10.0.1.6"
os = "linux"
roles = ["fw"]
reach = ["ssh"]
filesystem = true
scheduler = "cron"

[authenticators]
netops = { human = true }
