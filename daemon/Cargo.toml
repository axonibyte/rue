[package]
name = "rued"
description = "rue's standalone engine daemon (docs/ROADMAP.md section 7); this unit brings `rued migrate`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rued"
path = "src/main.rs"

[dependencies]
rue-core = { path = "../core" }
rue-engine = { path = "../engine" }
rue-surface = { path = "../surface" }
rue-bindings = { path = "../bindings" }
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# rued as a Windows service: the service-control dispatcher and its stop
# handler (docs/ROADMAP.md 7.9, 12). Built on the gnu target; run as a
# service on no machine this phase (docs/TESTING.md).
windows-service = "0.8"
