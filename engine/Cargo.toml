[package]
name = "rue-engine"
description = "rue's engine: the lifecycle over a locked store, bindings, executors, arming, the control channel and the hook protocol (docs/ROADMAP.md section 7)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rue-core = { path = "../core" }
rue-render = { path = "../render" }
# The hook protocol's wire (docs/hook-protocol.md v1); the adapters in
# `hook.rs` are this crate's, the frames they build are that one's.
rue-hook-proto = { path = "../hook-proto" }
serde.workspace = true
serde_json.workspace = true
# File digests for markers and drift (the same SHA-256 the artifact reads).
sha2.workspace = true
# The journal's optional signing: OpenSSH Ed25519 keys and SSHSIG
# signatures, pure Rust (docs/ROADMAP.md 5.10).
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "std", "rand_core"] }
# The CSPRNG the key generator draws from.
rand_core = { version = "0.6", features = ["getrandom"] }
# The SSHSIG's binary form (ssh-key's Encode and Decode are this crate's).
ssh-encoding = { version = "0.2", default-features = false, features = ["alloc"] }
# The request nonce (section 5.11): core stays free of randomness.
getrandom = "0.3"

[dev-dependencies]
libc = "0.2"
# A key that is not Ed25519, generated in-process for the signer's refusal.
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "std", "rand_core", "p256"] }

[target.'cfg(windows)'.dependencies]
# The control channel's named pipe and its access-control list, and the
# client's SID at the other end of it (docs/ROADMAP.md 7.4, 12).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[target.'cfg(unix)'.dependencies]
# flock on the store's lock file; the effective uid the store must be owned by.
libc = "0.2"
