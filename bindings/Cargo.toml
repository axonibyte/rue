[package]
name = "rue-bindings"
description = "rue's generic built-in bindings (docs/ROADMAP.md section 7.3): the one generic implementation the engine ships per binding kind"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rue-core = { path = "../core" }
rue-engine = { path = "../engine" }
rue-render = { path = "../render" }
serde_json.workspace = true
# `secrets from: file()` reads a TOML table of reference to value, the
# same format the inventory uses (Appendix C).
toml.workspace = true

[target.'cfg(unix)'.dependencies]
# flock on the host lock; the rue group's existence for bootstrap.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The host lock as a locked file (the Phase 3 amendment to 7.7).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
