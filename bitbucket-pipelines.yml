# Pinned rather than :latest so a tag build today and a rebuild next year use
# the same compiler, and pinned to a Debian codename so the apt packages the
# steps install (mingw, wine, python3-pip) come from one release. Bump
# deliberately, together with rust-version in Cargo.toml, the toolchain check
# in tools/check.sh, the nightly pin in ci/build-target.sh, and the GHC image
# below (whose digest .reaper.toml carries).
#
# The Rust image is the default because the house pipeline shape is Rust; the
# gate step runs in the GHC image because the Phase 0 prototype is Haskell
# and stays the specification the crates are held to.
image: rust:1.97-trixie

definitions:
  caches:
    # Keyed on the lockfile: a dependency change is a new cache.
    cargo:
      key:
        files:
          - Cargo.lock
      path: .cargo_cache
    # The store only, keyed on the freeze: the extracted Hackage index is far
    # too large to cache and `cabal update` under a pinned index-state changes
    # nothing about the plan.
    cabal-store:
      key:
        files:
          - proto/cabal.project.freeze
      path: .cabal_cache/store

  steps:
    - step: &doMirror
        name: Mirror repository
        # ci/mirror.sh re-clones and pushes again when a concurrent mirror
        # (a push and its tag start two pipelines) wins the ref lock first;
        # the clone is needed for the script itself.
        script:
          - bash ci/mirror.sh git@bitbucket.org:${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}.git git@github.com:${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}.git

    - step: &doCheck
        name: Gate (tools/check.sh)
        # The stock GHC 9.10.3 image: the cabal phases need GHC and this step
        # needs nothing else. The reaper guest runs the same gate in the Rust
        # image with GHC from ghcup, so the gate is proven under both.
        image: haskell:9.10.3-bookworm
        caches:
          - cabal-store
        script:
          - export CABAL_DIR="$BITBUCKET_CLONE_DIR/.cabal_cache"
          # The stock GHC image carries neither shellcheck nor patch; both are
          # real dependencies of the gate.
          - apt-get -qq update
          - apt-get -qq install -y --no-install-recommends shellcheck patch
          # This image has no cargo. The four cargo phases and the darwin
          # dependency guard are declared skipped here because doFetchAndTest
          # performs exactly those in the Rust image; the pipeline as a whole
          # runs every phase, and the declaration is what keeps a missing
          # tool from passing quietly.
          - RUE_CHECK_SKIP_OK=darwin-deps,cargo-fmt,cargo-clippy,cargo-build,cargo-test RUE_CABAL_UPDATE=1 sh tools/check.sh

    - step: &doFetchAndTest
        name: Fetch dependencies, lint and run tests
        caches:
          - cargo
        script:
          - export CARGO_HOME="$BITBUCKET_CLONE_DIR/.cargo_cache"
          - rustup component add rustfmt clippy
          # The render crate's execution tests run the Python artifact the
          # way a scheduler will: `uv run --offline --script`, so uv and a
          # cached interpreter must exist here (the Rust image has neither).
          - apt-get -qq update && apt-get -qq install -y --no-install-recommends python3-pip
          - pip3 install --break-system-packages uv
          - uv python install 3.12
          - cargo fetch --locked
          # The repository is kept fmt-clean and clippy-clean; the gate is what
          # keeps it that way.
          - cargo fmt --check
          - cargo clippy --workspace --all-targets --locked -- -D warnings
          - sh tools/lint-darwin-deps.sh
          # rue-e2e is the tier 5 harness; it runs on a reaper guest only (tools/check.sh).
          - cargo test --workspace --exclude rue-e2e --release --locked

    - step: &doTestWindows
        # Windows is first-class (D-031). The suite runs on the Windows target
        # under wine, here and in the Ubuntu reaper guest, from one script.
        name: Test x86_64-pc-windows-gnu under wine
        caches:
          - cargo
        script:
          - export CARGO_HOME="$BITBUCKET_CLONE_DIR/.cargo_cache"
          - bash ci/test-windows.sh

    - step: &buildLinuxAmd64
        name: Build x86_64-unknown-linux-gnu
        caches:
          - cargo
        artifacts:
          - dist/*
        script:
          - bash ci/build-target.sh x86_64-unknown-linux-gnu

    - step: &buildLinuxArm64
        name: Build aarch64-unknown-linux-gnu
        caches:
          - cargo
        artifacts:
          - dist/*
        script:
          - bash ci/build-target.sh aarch64-unknown-linux-gnu

    - step: &buildFreebsdAmd64
        name: Build x86_64-unknown-freebsd
        caches:
          - cargo
        artifacts:
          - dist/*
        script:
          - bash ci/build-target.sh x86_64-unknown-freebsd

    - step: &buildFreebsdArm64
        name: Build aarch64-unknown-freebsd
        caches:
          - cargo
        artifacts:
          - dist/*
        script:
          - bash ci/build-target.sh aarch64-unknown-freebsd

    - step: &buildDarwinAmd64
        # Cross-linked with zig against its bundled libSystem, no macOS SDK;
        # tools/lint-darwin-deps.sh keeps the graph framework-free. Built and
        # packaged, executed nowhere until a Mac exists (ROADMAP.md section 11).
        name: Build x86_64-apple-darwin
        caches:
          - cargo
        artifacts:
          - dist/*
        script:
          - bash ci/build-target.sh x86_64-apple-darwin

    - step: &buildDarwinArm64
        name: Build aarch64-apple-darwin
        caches:
          - cargo
        artifacts:
          - dist/*
        script:
          - bash ci/build-target.sh aarch64-apple-darwin

    - step: &buildWindowsAmd64
        # Windows is first-class (D-031): every binary, not a client-only build.
        name: Build x86_64-pc-windows-gnu
        caches:
          - cargo
        artifacts:
          - dist/*
        script:
          - bash ci/build-target.sh x86_64-pc-windows-gnu

    # The SDKs of ROADMAP.md 7.11 that are not Rust, each judged against
    # `rue sdk-conform` in the image that carries its toolchain, using the rue
    # buildLinuxAmd64 just built (ci/sdk-conform.sh). The Rust SDK and the
    # shim are workspace crates, so doFetchAndTest already judges them. These
    # run after the builds and before a deploy, so no tag publishes binaries
    # whose SDKs were not judged against them.
    #
    # Every image is glibc 2.39 or later, because the binary is: built on
    # trixie, its std links pidfd_spawnp and pidfd_getpid at GLIBC_2.39. A
    # bookworm image (2.36) -- the official elixir image's base, and the
    # default .NET 8 SDK's -- would fail to load it, so those two are pinned
    # to a trixie and a noble variant. ci/sdk-conform.sh runs `rue --version`
    # first, so an image that cannot load the binary fails there, by name.
    - step: &conformPython
        name: SDK conformance (Python)
        image: python:3.12-slim-trixie
        script:
          - sh ci/sdk-conform.sh python

    - step: &conformElixir
        # sdk/conform-all.sh compiles the package with mix before judging it.
        name: SDK conformance (Elixir)
        image: hexpm/elixir:1.18.4-erlang-27.3.4.16-debian-trixie-20260824-slim
        script:
          - sh ci/sdk-conform.sh elixir

    - step: &conformJava
        # The conformance run compiles with javac and needs no network; this
        # step also builds the jar with maven, which is what proves the POM
        # (the Ubuntu reaper guest carries a JDK and no maven).
        name: SDK conformance (Java)
        image: maven:3.9.16-eclipse-temurin-21-noble
        caches:
          - maven
        script:
          - mvn -B -q -f sdk/java/pom.xml package
          - sh ci/sdk-conform.sh java

    - step: &conformDotnet
        # On Linux: 7.11 pairs .NET with the Windows guest, which Phase 3W
        # still owns (ROADMAP.md, Phase 4, "not proven"). The pack proves the
        # NuGet package builds, with warnings as errors.
        name: SDK conformance (.NET)
        image: mcr.microsoft.com/dotnet/sdk:8.0-noble
        caches:
          - dotnetcore
        script:
          - export DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1
          - dotnet pack sdk/dotnet/src/RueHook -c Release -o dist-nuget
          - sh ci/sdk-conform.sh dotnet

    - step: &doDeploy
        name: Deploy multi-target artifacts
        # The clone stays enabled: the tag-equals-version check below reads
        # Cargo.toml, and with the clone off (as v0.0.1's first deploy ran)
        # the file is absent and every tag is refused.
        script:
          - |
            # Refuse rather than publish nothing: a tag with no artifacts is a
            # tag that was cut before Phase 1 armed the builds, or a broken build.
            shopt -s nullglob
            files=(dist/*)
            shopt -u nullglob
            if [[ ${#files[@]} -eq 0 ]]; then
              echo "deploy: no artifacts under dist/; refusing" >&2
              exit 1
            fi
            # The tag must agree with the workspace version (ROADMAP.md section 12).
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
            if [[ -z "$version" ]]; then
              echo "deploy: no workspace version found in Cargo.toml; refusing" >&2
              exit 1
            fi
            if [[ "$BITBUCKET_TAG" != "v$version" ]]; then
              echo "deploy: tag $BITBUCKET_TAG disagrees with workspace version v$version; refusing" >&2
              exit 1
            fi
            for f in dist/*; do
              if [[ -f "$f" && "$f" != *.sha256 ]]; then
                echo "Uploading $f..."
                sha256sum "$f" | awk '{ print $1 }' > "${f}.sha256"
                curl -sS --fail-with-body \
                  -H "Authorization: Bearer ${BB_PUB_SECRET}" \
                  -X POST "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}/downloads" \
                  --form files=@"${f}" --form files=@"${f}.sha256"
                echo "Uploaded $f + checksum"
              fi
            done

pipelines:
  branches:
    main:
      - step: *doMirror
      - step: *doCheck
      - step: *doFetchAndTest
      - step: *doTestWindows
      - parallel: &buildAll
          steps:
            - step: *buildLinuxAmd64
            - step: *buildLinuxArm64
            - step: *buildFreebsdAmd64
            - step: *buildFreebsdArm64
            - step: *buildDarwinAmd64
            - step: *buildDarwinArm64
            - step: *buildWindowsAmd64
      - parallel: &conformAll
          steps:
            - step: *conformPython
            - step: *conformElixir
            - step: *conformJava
            - step: *conformDotnet

    '{feature/**,bugfix/**,release/**,hotfix/**}':
      - step: *doMirror
      - step: *doCheck
      - step: *doFetchAndTest
      - step: *doTestWindows

    '**':
      - step: *doMirror

  tags:
    '**':
      - step: *doMirror
      - step: *doCheck
      - step: *doFetchAndTest
      - step: *doTestWindows
      - parallel: *buildAll
      - parallel: *conformAll
      - step: *doDeploy
