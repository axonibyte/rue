[package]
name = "rue-hook"
description = "The hook shim (docs/ROADMAP.md 7.11): registers as a hook and hands each request to a configured command on its stdin, so anything that can read a line and write one can serve a kind"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rue-hook"
path = "src/main.rs"

[dependencies]
rue-hook-proto = { path = "../../hook-proto" }
rue-hook-sdk = { path = "../rust" }
serde_json.workspace = true
clap.workspace = true

[dev-dependencies]
# The conformance runner plays the daemon. A dev-only edge: nothing the
# engine ships depends on a shim.
rue-engine = { path = "../../engine" }
